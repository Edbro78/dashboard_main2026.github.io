<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator for Formuesskatt</title>

<!-- Tailwind CSS for styling -->
<script src="Alle JS filer/tailwind.browser.js"></script>

<!-- SPWM design tokens + formuesskatt styles -->
<link rel="stylesheet" href="SPWM mal/colors_and_type.css">
<link rel="stylesheet" href="formuesskatt styles.css">
</head>
<body class="antialiased font-sans">





<!-- =========== SIDE 1: FORMUESSKATTKALKULATOR =========== -->
<div id="page1" class="page active" style="display: block !important;">
<div class="dashboard-container min-h-screen w-full flex flex-col items-center justify-center p-4 lg:p-8 formuesskatt-dashboard">
<div class="w-full mx-auto flex flex-col min-h-0">
<header class="text-center formuesskatt-header"> 
<h1 class="formuesskatt-title">Formuesskatt</h1> 

</header>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 formuesskatt-grid">
<!-- Kolonne 1: Input -->
<div class="lg:col-span-1 flex flex-col formuesskatt-col"> 
<div class="bg-[#24385B] p-4 rounded-xl flex flex-col border border-[#364A6E] card-panel formuesskatt-panel"> 
<div class="flex justify-between items-center border-b border-[#364A6E] formuesskatt-h2">
  <h2 class="heading-m text-white mb-0">Input</h2>
  <div class="flex gap-1.5 flex-1 justify-end" style="max-width: 50%">
    <button type="button" id="hent-fra-tkonto-btn" class="person-btn flex-1 bg-blue-600 text-white font-medium py-2 px-2.5 rounded-full text-sm hover:bg-blue-700 transition-colors">Hent fra T-konto</button>
  </div>
</div> 
<div class="formuesskatt-input-group flex-grow"> 
<div class="formuesskatt-field">
<label class="block label-ui text-slate-300 formuesskatt-label">Antall personer</label>
<div class="flex gap-1.5" id="person-count"> 
<button data-value="1" class="person-btn flex-1 bg-blue-600 text-white font-medium py-2 px-2.5 rounded-full text-sm">1 person</button> 
<button data-value="2" class="person-btn flex-1 bg-slate-700 text-slate-300 font-medium py-2 px-2.5 rounded-full text-sm">2 personer</button> 
</div>
</div>
<div class="formuesskatt-field">
<label for="private-debt" class="block label-ui text-slate-300 formuesskatt-label">Privat gjeld (NOK)</label>
<input type="text" id="private-debt" class="asset-input formuesskatt-input" value="0" placeholder="0">
<button id="reset-btn" class="w-full formuesskatt-reset-btn bg-[#24385B] hover:bg-[#364A6E] text-slate-300 font-semibold py-1 px-2 rounded-md text-xs transition-colors border border-[#364A6E]">Nullstill alt</button>
</div>
</div>
<h3 class="heading-s text-white border-b border-[#364A6E] formuesskatt-h3">Eiendeler</h3> 
<div id="assets-container" class="formuesskatt-assets flex-grow min-h-0 overflow-y-auto custom-scrollbar"> 
</div> 
</div>
</div>

<!-- Kolonne 2: Resultater og navigasjon -->
<div class="lg:col-span-1 flex flex-col formuesskatt-col"> 
<div class="bg-[#24385B] p-4 rounded-xl flex flex-col border border-[#364A6E] card-panel formuesskatt-panel">
<h2 class="heading-m text-white border-b border-[#364A6E] formuesskatt-h2">Resultater</h2> 
<div class="text-center bg-[#0F172A]/80 p-4 rounded-xl formuesskatt-summary summary-panel">
<div id="total-wealth-tax" class="output-value heading-m">0 kr</div>
<div class="output-label mt-1 heading-s">Total Formuesskatt</div>
</div>
<div class="formuesskatt-metrics bg-slate-800/60 p-4 rounded-xl flex-grow text-sm border border-[#364A6E] metrics-panel min-h-0 overflow-y-auto custom-scrollbar">
<div class="flex justify-between items-center text-slate-300 paragraph-text"><span>Bruttoformue:</span><span id="gross-wealth" class="heading-s text-white">0 kr</span></div><hr class="border-[#364A6E]">
<div class="flex justify-between items-center text-slate-300 paragraph-text"><span>Verdsettelsesrabatt:</span><span id="total-discount" class="heading-s text-white">0 kr</span></div><hr class="border-[#364A6E]">
<div class="flex justify-between items-center text-slate-300 paragraph-text"><span>Nettoformue (etter rabatt):</span><span id="net-wealth" class="heading-s text-white">0 kr</span></div><hr class="border-[#364A6E]">
<div class="flex justify-between items-center text-slate-300 paragraph-text"><span>Fradragsberettiget gjeld:</span><span id="deductible-debt" class="heading-s text-white">0 kr</span></div><hr class="border-[#364A6E]">
<div class="flex justify-between items-center text-slate-300 paragraph-text"><span>Fribeløp:</span><span id="tax-free-allowance" class="heading-s text-white">0 kr</span></div><hr class="border-[#364A6E]">
<div class="flex justify-between items-center text-white"><span class="heading-s">Skattegrunnlag:</span><span id="taxable-base" class="heading-m">0 kr</span></div><hr class="border-[#364A6E]"> 
<div class="flex justify-between items-center text-slate-300 mt-1.5 paragraph-text"><span>Skatteandel av bruttoformue:</span><span id="tax-as-percentage-of-gross" class="heading-s text-white">0.00 %</span></div> 
</div>
</div>
</div>
</div>
</div>
</div>

<!-- =========== SIDE 2: KJØPEKRAFTKALKULATOR =========== -->
<div id="page2" class="page">
<div class="dashboard-container min-h-screen w-full flex flex-col items-center justify-center p-4 lg:p-8">
<div class="w-full h-full flex flex-col justify-between">
<header class="text-center mb-1"> 
<h1 class="heading-m text-white mb-0.5">Hvilken bankrente må du ha for å gå i null etter skatt?</h1> 
</header>

<div class="grid grid-cols-1 flex-grow">
<div class="bg-[#24385B] p-6 rounded-xl h-full flex flex-col border border-[#364A6E]"> 
<div class="mb-1.5 w-48"> 
<label for="inflation-rate" class="block label-ui text-slate-300">Forventet inflasjon (%)</label>
<input type="text" id="inflation-rate" class="asset-input mt-0.5" value="3.0">
</div>

<div class="space-y-1.5 flex-grow overflow-y-auto custom-scrollbar"> 
<div id="private-person-table" class="rate-table-container mb-2"></div> 
                                    
<div id="as-table" class="rate-table-container rate-table-as"></div>
</div>
</div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-2 mt-auto pt-2">
<div class="lg:col-span-1">
<div class="text-center"> 
<button id="goToPage1Btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-2 rounded-lg shadow-md transition-transform transform hover:scale-105 text-sm"> 
← tilbake til Formuesskatt
</button>
</div>
</div>
<div class="lg:col-span-1 hidden lg:block">
</div>
</div>
</div>
</div>
</div>


<!-- Custom JavaScript -->
    <script src="formuesskatt script.js?v=primar-innslag-14mnok"></script>
</body>
</html>
